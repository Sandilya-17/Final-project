Download any time; you can stop and continue (answers are remembered in this browser).</small></p>
<script>
const D=[{"id": 0, "text": "యాజమాన్యవాటాను ఏళ్ళ తరబడి కట్టని సంస్థలను యధేచ్ఛగా వదిలిపెడుతూ, ఉద్యోగులను వారి ఖర్మాన వదిలేసినవారు."}, {"id": 1, "text": "చట్టం ముందు ఎగవేతదారుడిగా ముద్రపడి, అంతకుముందే కేసులు ఎదుర్కొంటున్న వ్యక్తికి బ్యాంకులు పోటీపడి రుణాలు ఎందుకిచ్చాయన్నది సుప్రీంకోర్టు ప్రశ్న."}, {"id": 2, "text": "సమీప ప్రాణహిత నదిలో స్నానానికి వెళ్తానని ఎంపీ చెప్పగా, భద్రత దృష్ట్యా చెన్నూర్ రూరల్ సీఐ అభ్యంతరం తెలిపారు."}, {"id": 3, "text": "ముఖ్యంగా తూరుపు జిల్లాల్లో ఊష్ణోగ్రత చుక్కలు చూపిస్తోంది."}, {"id": 4, "text": "బెంగుళూరులో ఈ రకమైన ధోరణి ఇటీవలి కాలంలో బాగా పెరిగింది."}, {"id": 5, "text": "మృతదేహం పూర్తిగా కుళ్లిపోవడంతో వైద్యులైన రాజేందర్ ఇతర సిబ్బందిని ఎసై అక్కడికే తీసుకేళ్లి పోస్టుమార్టం చేశారు."}, {"id": 6, "text": "‘డిజిటల్ ఇండియా’కు గుండెకాయ వంటి బెంగుళూరులో జాతివివక్ష ఇంతగా ఉన్నందుకు ఆశ్చర్యమూ కలుగుతున్నది."}, {"id": 7, "text": "15 ఏళ్ల వయసులోనే ఉగ్రవాదుల్లో చేరిపోయాడు."}, {"id": 8, "text": "లక్ష కంటే ఎక్కువ రుణం తీసుకున్నా లక్ష లోపే మాఫీ అయ్యే అవకాశం ఉన్నందునా ఇలాంటి రైతులు కొందరు తమ రుణాలు రెన్యువల్ చేయించుకునేందుకు ఆసక్తి చూపడం లేదనేది అధికారులు స్పష్టం చేస్తున్నారు."}, {"id": 9, "text": "రక్షణ దళాల మధ్య మరింత సమన్వయానికి ప్రత్యేకంగా కమ్యూనికేషన్ వ్యవస్థ ఏర్పాటు చేయడం ఇదే మొదటిసారి కావడంతో ఈ వ్యవస్థను వినియోగించుకోవడంలో తొలుత కొన్ని ఇబ్బందులు ఏర్పడవచ్చు."}, {"id": 10, "text": "ఈ ఏడాది కూడా ఆలయ కమిటీ పోటీని ప్రకటించడంతో స్థానికుల నుంచి ఉన్నతాధికారులకు ఫిర్యాదులు వెళ్ళాయి."}, {"id": 11, "text": "ఈ అక్కసు మీదనే మిసైల్ టెక్నాలజీ క్లబ్లో భారత చేరకుండా గత ఏడాది ఇటలీ అడ్డుపడిన విషయం తెలిసిందే."}, {"id": 12, "text": "పర్యవసానంగా దేశ ఆర్థిక పరిస్థితి ఉదాసీనంగా మారింది."}, {"id": 13, "text": "దేశం యావత్తూ ‘జై భీమ్’ నినాదాలతో ప్రతిధ్వనిస్తుండగా, అటు కేంద్రమూ, ఇటు రాష్ట్రాలు పోటాపోటీగా పలు కార్యక్రమాలనూ, పథకాలనూ ప్రకటించాయి."}, {"id": 14, "text": "కోల్కతా చుట్టుపక్కల హుగ్లీ నది ఒడ్డు వెలిసిన దాదాపు 150 బడా పారిశ్రామిక కర్మాగారాలు ఆ జలాల్ని పూర్తిగా కలుషితం చేశాయి."}, {"id": 15, "text": "తనకు ఇచ్చిన తుపాకీతో తెలంగాణ వ్యక్తి పిట్టలను, అడవి జంతువులను కాల్చిచంపి పొట్టనింపుకునేవాడట!"}, {"id": 16, "text": "రెండేళ్ళక్రితం వీచిన సానుకూల పవనాలు ఇప్పుడు కూడా వీస్తాయన్న నమ్మకంతో పోరాడుతున్నది."}, {"id": 17, "text": "ఆధికారులు,ప్రజాప్రతినిధులు స్పందించి మిల్లులో ఉత్పత్తి ప్రారంభంమయ్యేలా చూడాలని వారు కోరారు."}, {"id": 18, "text": "అటువంటి ప్రమాదం ఎదురైనపక్షంలో, సభ్యత్వం కోసం మొండిగా పోవడం కంటే ఈ ప్రత్యేక మినహాయింపును కాపాడుకోవడమే ఉత్తమం."}, {"id": 19, "text": "దాదాపు 8శాతం ముస్లిం జనాభా ఉన్న ఫ్రాన్స్లో అధికులు ఉత్తరాఫ్రికా దేశాలనుంచి వచ్చినవారే."}, {"id": 20, "text": "నర్సాపూర్ పీహెచ్సీ భవనం ఐదేళ్లు గడుస్తున్నా పూర్తికాకపోవడంతో గిరిజనులకు ఇబ్బందులు పడుతున్నారని సభ్యులు, ప్రస్తావించగా బజార్హత్నూర్ పీహెచ్సీలో వైద్యులు ఎప్పుడూ ఉండరని జెడ్పీటీసీ సభ్యుడు నారాయణ సమావేశం దృష్టికి తీసుకువచ్చారు."}, {"id": 21, "text": "ప్రపంచీకరణ నేపథ్యంలో దేశవ్యాప్తంగా ఒకే పన్ను విధించడం ప్రస్తుత కాలంలో అనివార్యం."}, {"id": 22, "text": "పట్టణంలోని అటవీ శాఖా కార్యాలయంలో సోమవారం జిల్లా సబ్ డీఎఫో తిరుమల్రావు ఆధ్వర్యంలో నిర్వహించిన అడవుల సంరక్షణపై జిల్లా అటవీ అధికారులకు మూడు రోజుల శిక్షణ కార్యక్రమానికి ఆయన ముఖ్య అతిథిగా హాజరయ్యారు."}, {"id": 23, "text": "క్రీడా సంఘాల రాజకీయాలు, ఆర్ధిక సహాయాల అగచాట్లు, మౌలిక సదుపాయాల కష్టాలన్నింటినీ పక్కనపెట్టి కేవలం పతకాల పంట పండించాలని కోరుకోవడం కూడా అత్యాశే అవుతుంది."}, {"id": 24, "text": "ఇటీవల అమెరికా, బ్రిటన్, ఫ్రాన్స్, టర్కీ దేశాలలో ఉగ్రవాదుల దాడులు జరిగాయి."}, {"id": 25, "text": "ఇది అక్కడి భద్రతాదళాలకు ప్రధాన సమస్యగా మారింది."}, {"id": 26, "text": "2002లో గోద్రా అనంతర అల్లర్లతో అల్లాడిన గుజరాత్ రాష్ట్రం ఇప్పుడిప్పుడే ఆ పీడకలను మరచిపోతున్న తరుణంలో దళితులపై దాడులు చోటు చేసుకోవడం శోచనీయం."}, {"id": 27, "text": "ఎంత మంది మరణించినా సంయమనం పాటించి ప్రసారాలు చేయడం వల్ల మీడియా ప్రతిష్ట ఏ మాత్రం తగ్గదు."}, {"id": 28, "text": "రంజిత్ సింగ్ తన పదవి కాలంలో ఈ రెండు కుంభకోణాల నిందితులతో కలిసినట్లు ప్రాధమిక ఆధారాలు ఉన్నాయని నివేదికలో ఎం ఎల్ శర్మ పేర్కొన్నారు."}, {"id": 29, "text": "రెవెన్యూ అధికారులు ఆ భూమిని స్వాధీనం చేసుకోగా అందులో పంట ఉందని, తాము పంట తీసుకున్న తర్వాత భూమి అప్పగిస్తానని చెప్పాడు."}, {"id": 30, "text": "సిరియా పొరుగుదేశమైన టర్కీ, ఇస్లామిక్ స్టేట్ విషయంలో తన మిత్రదేశాల తరఫున ఎన్ని విన్యాసాలు చేస్తున్నదో తెలిసిందే."}, {"id": 31, "text": "వీరంతా అక్కడి సమస్యలను మరింత జటిలం చేస్తున్నారు."}, {"id": 32, "text": "బ్లేడుతో బెదిరించి నిర్భందించి లైంగికదాడికి ఒడిగట్టాడు."}, {"id": 33, "text": "టీ-20 మహిళా ప్రపంచక్పనకు ముందు భారత జట్టులో ఈ గెలుపు ఎనలేని ఆత్మవిశ్వాసం నింపనుంది."}, {"id": 34, "text": "నల్లజాతివారిని తెల్లపోలీసులు ఊచకోసినా పరవాలేదు కానీ, తెల్లపోలీసులపై ప్రతిదాడులు పెరగడం అమెరికన్లను అధికంగా భయపెడుతున్నది."}, {"id": 35, "text": "ఉత్తరప్రదేశ్లోని మథురలో పోలీసులకూ, స్థలం ఆక్రమణదారులకు మధ్య జరిగిన కాల్పుల్లో ఇద్దరు పోలీసు అధికారులతో సహా పాతికమంది మరణించిన ఘటన విషాదంతో పాటు ఆశ్చర్యాన్ని కలిగిస్తున్నది."}, {"id": 36, "text": "గతంలో సీమాంధ్ర ప్రభుత్వాలు తెలంగాణలో పుష్కరాలను నిర్వహించేందుకు కనీసం కోటి రూపాయలను కూడా ఖర్చు చేయలేదని, ఇప్పుడు టీఆరెస్ ప్రభుత్వం కోట్లాది రూపాయలను పుష్కరాల కోసం కేటాయిస్తూ తెలంగాణ ప్రజలకు మనోభావాలకు అద్దం పడుతోందన్నారు."}, {"id": 37, "text": "అంబేడ్కర్ వారసత్వాన్ని ఈ అరవయ్యేళ్ళ కాలంలో తక్కువచేసి చూపించినందుకు కాంగ్రెసను దునుమాడారు ప్రధాని నరేంద్రమోదీ."}, {"id": 38, "text": "రాష్ట్ర ప్రభుత్వం ప్రవేశపెట్టిన హరితహారం పథకంలో భాగంగా రాబోయే మూడేళ్లలో ప్రతి గ్రామపంచాయతీలో 33 వేల మెక్కలు,నియోజకవర్గానికి 40 లక్షల మెక్కలు నాటాలని పిలుపునిచ్చారు."}, {"id": 39, "text": "పాత్రికేయుడు ఎంజె అక్బర్కు విదేశాంగశాఖ సహాయమంత్రి పదవిని అప్ప గించడం, దౌత్యరంగంలో పాత్రికేయుల సేవలను వినియోగించుకొనే గత సంప్ర దాయాలకు అనుగుణంగా ఉన్నది."}, {"id": 40, "text": "గత కొద్ది కాలంగా ఇస్లామిక్ రాడికల్స్ అనే సంస్థ ఒకటి ఫ్రాన్స్లో చురుకుగా పని చేస్తున్నది."}, {"id": 41, "text": "ఐరోపాలోని మిగతా దేశాలతో పోలిస్తే బ్రిటన్కు ప్రత్యేక గుర్తింపు ఉంది."}, {"id": 42, "text": "ఈ సందర్భంగా ఎమ్మెల్యే రేఖానాయక్ మాట్లాడారు."}, {"id": 43, "text": "అమెరికన సమాజాన్ని నిలువునా చీల్చే ఆయన వ్యాఖ్యలతో 70 లక్షల మంది అమెరికన ముస్లింలు ప్రత్యక్షంగా వొణికిపోతున్నారు."}, {"id": 44, "text": "అయితే అర్హులైన రైతులకు మాత్రం రుణమాఫీ అందించితీరాలనే ప్రభుత్వం రైతుల పరిస్థితులను పరిగణలోకి తీసుకుని రెన్యువల్ గడువును ఎప్పటికప్పుడు పెంచుకుంటూ వస్తోంది."}, {"id": 45, "text": "అంతేకాదు 9/11 అమెరికా ట్విన్ టవర్ల దాడికి కారణం జార్జి బుష్ చర్యలే తప్ప మరొకటి కాదనేది జకీర్ నాయక్ వాదన."}, {"id": 46, "text": "ప్రస్తుత అశాంతికి ప్రత్యక్ష కారణాలేమైనా, మూలాలు మాత్రం- సంప్రదింపుల ప్రక్రియను నిలిపివేయడంలోనే ఉన్నాయని భావించవచ్చు."}, {"id": 47, "text": "ప్రస్తుతం అమెరికాకు ప్రపంచవ్యాపితంగా 132 దేశాల్లో 702 సైనిక స్థావరాలున్నాయి."}, {"id": 48, "text": "పెన్గంగ ప్రాజెక్టు నిర్మాణం తర్వాత ఈ ప్రాంతం సస్యశ్యామలం అవుతుందని చెప్పారు."}, {"id": 49, "text": "దాదాపు అన్ని ద్వీప సముదాయాల పైనా చెనా తన హక్కు ప్రకటించుకుంది."}, {"id": 50, "text": "వెంటనే చికిత్స కోసం లక్షెట్టిపేట ప్రభుత్వ అసుపత్రికి తరలించగా పరిస్థితి విషమంగా ఉండడంతో మెరుగైన వైద్యం నిమితం కరీంనగర్ అసుపత్రి తరలిస్తుండగా మార్గ మధ్యలో మృతి చెందాడు."}, {"id": 51, "text": "తాజాగా జరిగిన యూరో కప్ మన ఫుట్బాల్ దీన స్థితిని గుర్తు చేసింది. ప్రభుత్వంతో పాటు అఖిల భారత్ ఫుట్బాల్ సంఘం భారత్లో సాకర్ అభివృద్ధిపై ప్రత్యేక దృష్టి సారించాలి."}, {"id": 52, "text": "సవరణలు ప్రతిపాదించిన కొందరు సభ్యులు సభకు రాకపోవడం, అనేక సవరణలు మూజువాణీ ఓటుతో తిరస్కరణకు గురికావడం మన ప్రతినిధుల బాధ్యతారాహిత్యాన్ని తెలియచెబుతున్నది."}, {"id": 53, "text": "వెళ్లాలా వద్దా అని ఊగిసలాడి చివరకు వెళ్ళినవారూ, ట్రంప్కు వ్యతిరేకంగా బలంగా బల్లగుద్ది ప్రజాస్వామ్యాన్ని పరిరక్షించాలని సంకల్పించిన వారూ కూడా అంతిమంగా అక్కడ బోల్తాపడ్డారు."}, {"id": 54, "text": "వాహనాలతో వెంబడించి వారిని వెంటతరమడం యాదృచ్ఛికం కాదు."}, {"id": 55, "text": "సోలార్ విద్యుత పరికరాలను ఏర్పాటు చేయకుండా తమను టీం సోలార్ కంపెనీ మోసం చేసిందని ఒక వినియోగదారుడు కోర్టులో కేసు వేయడంతో తీగ లాగితే డొంకంతా కదిలిన చందంగా ముఖ్యమంత్రి చాందీ, అతని మంత్రివర్గంతో ముడిపడిన కోట్లాది రూపాయల సోలార్ స్కాం వెలుగులోకి వచ్చింది."}, {"id": 56, "text": "ఈ నేపథ్యంలో మంచిర్యాల కేంద్రంగా మరో సహాయ సంచాలకుల కార్యాలయాన్ని ప్రభుత్వం ఏర్పాటు చేస్తోంది."}, {"id": 57, "text": "ఇంతటి డిమాండ్ ఉన్నది కాబట్టే భారత ఎలకాట్రనిక్స్ ఇప్పటికే మూడువందల కోట్లతో బెంగుళూరులో ఉపగ్రహ తయారీ కేంద్రాన్ని ఏర్పాటుచేస్తున్నది."}, {"id": 58, "text": "నెలకోమారు ఇంతకు అధిక సంఖ్యలో ఉపగ్రహాలను గుదిగుచ్చిన పీఎసఎల్వీలు నింగిలోకి దూసుకుపోతుంటాయి."}, {"id": 59, "text": "రాబోవు కాలంలో బంగారు తెలంగాణను నిర్మిస్తామని కేసీఆర్ చేసిన వాగ్ధానాన్ని నెరవేర్చుకునే అవకాశం కల్పించాలని కోరారు."}, {"id": 60, "text": "అయితే న్యాయాధికార పరిధులను అతిక్రమించి భారత భద్రతాదళాలు బుర్హాన్ వనిని హతమార్చాయని పాకిస్తాన్ అంటున్నది."}, {"id": 61, "text": "తాజాగా బంగ్లాదేశ్ రాజధాని ఢాకాలో జరిగిన ఉగ్రవాదుల దాడికి సంబంధించి కూడా మీడియా అత్యుత్సాహం 20 మంది ప్రాణాలు తీసింది."}, {"id": 62, "text": "దీనికారణంగానే భారతదేశం పలుదేశాలతో అణువాణిజ్యం సాగించగలుగుతున్నది."}, {"id": 63, "text": "ఆయనతో పాటు ఆదిలాబాద్ మాజీ మార్కెట్ కమిటీ చైర్మన్ అడ్డి భోజారెడ్డి,తాంసి తహసీల్దార్ రాథోడ్ రమేశ్, మండల కన్వీనర్ సామ నాగారెడ్డి, ఆదిలాబాద్ జిల్లాకేంద్రంలోని మండల పరిషత్ కార్యాలయాన్ని నిర్వహించిన కార్యక్రమంలో ఆ ర్డీఓ సుధాకర్రెడ్డి, ఎంపీపీ నైతం లక్ష్మి, ఎంపీడీఓ జితేందర్రెడ్డి పాల్గొన్నారు."}, {"id": 64, "text": "చాలాచోట్ల స్నానానికి సైతం పనికిరానంత మురికిగా తయారయ్యాయి."}, {"id": 65, "text": "పైగా ఈ టోర్నీకి ముందు ఆస్ర్టేలియా, శ్రీలంక వంటి జట్లతో ద్వైపాక్షిక టీ-20 సిరీసలు సాధించడం, ఆసియా కప్లోనూ విజయకేతనం ఎగరవేయడంతో టీమిండియాపై అంచనాలు అమాంతం పెరిగిపోయాయి."}, {"id": 66, "text": "అయినా 43 శాతం లభించింది."}, {"id": 67, "text": "ఇటీవలే మలేసియా మాస్టర్స్ బ్యాడ్మింటన్ టోర్నీలో చాంపియన్గా నిలిచిన తెలుగు తేజం పీవీ సింధు కొత్త ఏడాదిలో శుభారంభం అందిస్తే సానియా, మిథాలీ దాన్ని కొనసాగించారు."}, {"id": 68, "text": "ఈ గడువులోగా వివిధ పథకాలు అ మలు చేయాల్సి ఉంది."}, {"id": 69, "text": "అయితే ఇది తప్పని సరి అయిన పరిణామం."}, {"id": 70, "text": "ఈ విధమైన పన్ను వల్ల నిపుణుల అంచనా ప్రకారమే కేంద్ర ప్రభుత్వ రాబడి జిడిపిలో 1.5 శాతం నుంచి 2 శాతం దాకా పెరుగుతుంది."}, {"id": 71, "text": "దానితోపాటుగానే, అణు సరఫరాదారుల బృందం (న్యూక్లియర్ సప్లయర్స్ గ్రూప్-ఎనఎసజీ)లో ప్రవేశానికి మార్గం సుగమం కావడం సానుకూల పరిణామం."}, {"id": 72, "text": "అయినా మన వాళ్ల ప్రతిభాపాటవాలను కీర్తించవలసిందే."}, {"id": 73, "text": "ప్రీమియం అతి తక్కువగా ఉండటంతో పాటు గతంలో ఎన్నడూ లేనివిధంగా ఆధునిక సాంకేతికతను ఇందుకు వినియోగిస్తున్నామని చెబుతున్న ప్రధాని, ప్రచార లోపాన్ని భర్తీచేయడానికి ప్రజల సహకారం కోరడంతో పాటు తమ యంత్రాంగం పనితీరును మెరుగుపరచడం వల్ల అధిక ప్రయోజనం సాధించగలుగుతారు."}, {"id": 74, "text": "చెరువుల పునరుద్ధరణతో వ్యవసాయ రంగం అభివృద్ధి చెందుతుందని ఆయన ఆవాభావం వ్యక్తం చేశారు."}, {"id": 75, "text": "హైదరాబాద్లో స్థిర నివాసం ఏర్పరచుకున్న పలువురు సీనియర్ అధికారులు ఏపీకి తరలివెళ్లడానికి ససేమిరా అంటున్నారు."}, {"id": 76, "text": "దీనికి పరిష్కారంగా మొదటి అయిదు సంవత్సరాలు రాష్ట్రాల ఆదాయానికి గండి పడకుండా కేంద్రం సహకరిస్తూందని కేంద్రం హామీ ఇచ్చింది."}, {"id": 77, "text": "బ డుగు, బలహీన వర్గాలకు విద్యను అందించడంలో సర్కా రు విద్యా వ్యవస్థను పటిష్ఠ పర్చాలని డిమాండ్ చేశారు."}, {"id": 78, "text": "ఇలాంటి సంఘటనలు గతంలో పలుమార్లు వెలుగులోకి వచ్చాయి. బడ్జెట్ పోకడ ఏ విధంగా ఉంటుందో ముందుగానే వెల్లడి అయితే జాగ్రత్తపడవచ్చునని కార్పొరేట్ కంపెనీల ఎత్తుగడ."}, {"id": 79, "text": "బ్రిటన ఇదే తరహా చట్టాన్ని 1967లో, 21 సంవత్సరాలు దాటినవారి మధ్య పరస్పర అంగీకారంతో సాగే స్వలింగ సంపర్కం నేరం కాదంటూ సవరించుకుంది."}, {"id": 80, "text": "2016 మేలో జరిగిన అధ్యక్ష ఎన్నికలో ఎంత వ్యతిరేక ప్రచారం జరిగినప్పటికీ సామన్య ప్రజలు మాత్రం అతనికే మద్దతు తెలిపారు."}, {"id": 81, "text": "ఈ ఏడాది ఖరీఫ్ కాలం నుంచి అమలులోకి రాబోతున్న ఈ పథకంలోకి రాబోయే రెండేళ్ళలో దేశంలోని సగం మంది రైతులను తీసుకురావాలన్న లక్ష్యం అభినందించవలసిందే."}, {"id": 82, "text": "కాగా, జేడీయూను టెర్రరిస్టు సంస్థగా, సయూద్ను టెర్రరిస్టుగా ఐక్యరాజ్యసమితి 2008లో ప్రకటించింది."}, {"id": 83, "text": "సోమవారం మంత్రి 66వ జన్మదిన వేడుకలు స్వగ్రామం ఎల్లపెల్లిలో జరుపుకున్నారు."}, {"id": 84, "text": "ఈ నేపథ్యంలో చాలా మంది ఇతర పార్టీలకు చెందిన కార్యకర్తలు, నాయకులు కూడా పెద్ద సంఖ్యలో టీఆరెస్లో చేరుతున్నారు."}, {"id": 85, "text": "దీంతో ప్రజల్లో ఆగ్రహం కలిగింది. దానికి తోడు సిరియా నుంచి వలసలు పెరిగాయి."}, {"id": 86, "text": "ఉగ్రవాదులు ఆయుధాలు దాచుకునే ప్రాంతాలను ముందుగానే గుర్తించి భద్రతాదళాలు వాటిని నిర్వీర్యం చేస్తున్నాయి."}, {"id": 87, "text": "సమాజ క్షేమం కోసం ఒక సమాచారాన్ని వెల్లడిచేయడం పరువునష్టం కిందికి రాదు. అయితే, అది సమాజక్షేమం కోసమని రుజువు చేయవలసి ఉంటుంది."}, {"id": 88, "text": "ఇంతటి మార్పులను దేశ భద్రతకు అనుగుణంగా వినియోగించుకోవడంలో కేంద్ర ప్రభుత్వం ఒక అడుగు ముందుకు వేసింది."}, {"id": 89, "text": "విశాఖపట్టణంలో ఐటీ పరిశ్రమల పరిస్థితి ఎక్కడ వేసిన గొంగళి అక్కడే అన్నట్టుగా ఉంది."}]; let i=0, A={};
try{A=JSON.parse(localStorage.getItem("ann")||"{}");}catch(e){}
for(i=0;i<D.length&&A[D[i].id];i++);
function show(){document.getElementById("c").textContent=(i<D.length?"Sentence "+(i+1)+" of "+D.length:"All "+D.length+" done - click Download CSV")+" ("+Object.keys(A).length+" labelled)";
document.getElementById("fill").style.width=(100*Object.keys(A).length/D.length)+"%";
document.getElementById("s").textContent=i<D.length?D[i].text:"Done. Click Download CSV, then move the file into the project folder.";}
function a(l){if(i>=D.length)return;A[D[i].id]=l;try{localStorage.setItem("ann",JSON.stringify(A));}catch(e){}i++;show();}
function back(){if(i>0){i--;delete A[D[i].id];try{localStorage.setItem("ann",JSON.stringify(A));}catch(e){}show();}}
function save(){let t="id,my_label\n"+D.filter(x=>A[x.id]).map(x=>x.id+","+A[x.id]).join("\n")+"\n";
const u=URL.createObjectURL(new Blob([t],{type:"text/csv"}));const l=document.createElement("a");l.href=u;l.download="my_labels.csv";l.click();}
document.addEventListener("keydown",e=>{const k=e.key.toLowerCase();if(k=="p"||k=="n"||k=="u")a(k);else if(k=="b")back();});
show();
</script></body></html>
